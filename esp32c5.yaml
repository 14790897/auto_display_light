esphome:
  name: temt6000-sensor-c5
  platformio_options:
    monitor_speed: 115200
  on_boot:
    priority: -100
    then:
      # ESP32-C5 没有 GPIO12/13 的板载 LED，这里留空可按需配置
      - logger.log: "ESP32-C5 TEMT6000 sensor booted"

esp32:
  board: esp32-c5-devkitc-1
  variant: esp32c5
  framework:
    type: esp-idf
    # C5 只有 RISC-V 内核，Arduino 框架支持不完整，使用 ESP-IDF
    version: 5.3.0
    platform_version: 6.9.0

# WiFi 配置 — C5 支持 2.4GHz & 5GHz 双频 Wi-Fi 6
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # 创建 WiFi 热点作为备用
  ap:
    ssid: "TEMT6000-Sensor-C5"
    password: "12345678ABCD"

# Home Assistant API
api:

# WiFi Portal (配网门户)
captive_portal:

# OTA 更新
ota:
  platform: esphome

# 日志 — C5 通过 USB-Serial/JTAG 输出
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# Web 服务器
web_server:
  port: 80
  version: 2

# TEMT6000 光照传感器
# C5 ADC 引脚: 支持 GPIO0~6 中部分引脚，请根据实际接线修改
# 硬件接线 (3.3V 供电):
#   - TEMT6000 VCC (V) → ESP32 3.3V
#   - TEMT6000 GND (G) → ESP32 GND
#   - TEMT6000 OUT (S) → ESP32 GPIO3
sensor:
  - platform: adc
    pin: GPIO3
    name: "TEMT6000 Voltage"
    id: temt6000_voltage
    update_interval: 1s
    attenuation: 12db
    accuracy_decimals: 3
    unit_of_measurement: "V"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # 转换为光照百分比 (0-100%)
  - platform: template
    name: "TEMT6000 Percentage"
    id: temt6000_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:brightness-6"
    lambda: |-
      float voltage = id(temt6000_voltage).state;
      float pct = (voltage / 3.3) * 100.0;
      ESP_LOGI("temt6000", "Voltage: %.3fV, Percentage: %.1f%%", voltage, pct);
      return pct;
    update_interval: 1s

  # 估算光照强度 (Lux)
  - platform: template
    name: "TEMT6000 Lux"
    id: temt6000_lux
    unit_of_measurement: "lx"
    accuracy_decimals: 1
    device_class: illuminance
    state_class: measurement
    icon: "mdi:brightness-5"
    lambda: |-
      float voltage = id(temt6000_voltage).state;
      float lux;
      if (voltage < 0.01) {
        lux = 0;
      } else if (voltage < 1.0) {
        lux = voltage * 500;
      } else if (voltage < 2.0) {
        lux = 500 + (voltage - 1.0) * 1500;
      } else {
        lux = 2000 + (voltage - 2.0) * 6000;
      }
      return lux;
    update_interval: 1s

  # 系统运行时间
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# 光照等级分类
text_sensor:
  - platform: template
    name: "Light Level"
    id: light_level
    icon: "mdi:theme-light-dark"
    lambda: |-
      float pct = id(temt6000_percentage).state;
      if (pct < 5) return {"Very Dark"};
      if (pct < 20) return {"Dark"};
      if (pct < 40) return {"Dim"};
      if (pct < 60) return {"Moderate"};
      if (pct < 80) return {"Bright"};
      return {"Very Bright"};
    update_interval: 1s

# 二值传感器 - 光照检测
binary_sensor:
  - platform: template
    name: "Dark Detection"
    id: dark_detection
    lambda: |-
      float pct = id(temt6000_percentage).state;
      return pct < 20;
    filters:
      - delayed_on: 2s
      - delayed_off: 5s

  - platform: template
    name: "Bright Detection"
    id: bright_detection
    lambda: |-
      float pct = id(temt6000_percentage).state;
      return pct > 80;
    filters:
      - delayed_on: 2s
      - delayed_off: 5s
