name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          echo 'wifi_ssid: "AutoDisplayLight"' > secrets.yaml
          echo 'wifi_password: "12345678ABCD"' >> secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        run: esphome compile esp32c3.yaml
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - uses: actions/upload-artifact@v5
        with:
          name: firmware
          path: |
            .esphome/build/temt6000-sensor/build/firmware.factory.bin
            .esphome/build/temt6000-sensor/build/firmware.ota.bin

  build-firmware-integrated:
    name: Build Firmware (Integrated PCB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          echo 'wifi_ssid: "AutoDisplayLight"' > secrets.yaml
          echo 'wifi_password: "12345678ABCD"' >> secrets.yaml

      - name: Compile integrated firmware
        run: esphome compile temt-on-esp32c3.yaml
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Rename firmware files
        run: |
          cd .esphome/build/temt6000-integrated/build/
          mv firmware.factory.bin firmware-integrated.factory.bin
          mv firmware.ota.bin firmware-integrated.ota.bin

      - uses: actions/upload-artifact@v5
        with:
          name: firmware-integrated
          path: |
            .esphome/build/temt6000-integrated/build/firmware-integrated.factory.bin
            .esphome/build/temt6000-integrated/build/firmware-integrated.ota.bin

  build-firmware-c5:
    name: Build Firmware (ESP32-C5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          echo 'wifi_ssid: "AutoDisplayLight"' > secrets.yaml
          echo 'wifi_password: "12345678ABCD"' >> secrets.yaml

      - name: Compile C5 firmware
        run: esphome compile esp32c5.yaml
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Rename firmware files
        run: |
          cd .esphome/build/temt6000-sensor-c5/build/
          mv firmware.factory.bin firmware-c5.factory.bin
          mv firmware.ota.bin firmware-c5.ota.bin

      - uses: actions/upload-artifact@v5
        with:
          name: firmware-c5
          path: |
            .esphome/build/temt6000-sensor-c5/build/firmware-c5.factory.bin
            .esphome/build/temt6000-sensor-c5/build/firmware-c5.ota.bin

  build-exe:
    name: Build Exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyinstaller pystray pillow requests

      - name: Build exe
        run: pyinstaller autolight.spec

      - uses: actions/upload-artifact@v5
        with:
          name: exe
          path: dist/AutoDisplayLight.exe

  release:
    name: Release
    needs: [build-firmware, build-firmware-integrated, build-firmware-c5, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List files
        run: find artifacts/ -type f

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          echo "Version: $VERSION"
          gh release create "v$VERSION" \
            --repo ${{ github.repository }} \
            --title "AutoDisplayLight v$VERSION" \
            --notes "AutoDisplayLight Release $VERSION. 产物: firmware.* = 模块版固件 (esp32c3.yaml, Arduino, TEMT6000 模块+杜邦线); firmware-integrated.* = 集成版固件 (temt-on-esp32c3.yaml, ESP-IDF, 自制集成 PCB); firmware-c5.* = ESP32-C5 版固件 (esp32c5.yaml, ESP-IDF, Wi-Fi 6 双频); AutoDisplayLight.exe = Windows 托盘客户端" \
            artifacts/firmware/* artifacts/firmware-integrated/* artifacts/firmware-c5/* artifacts/exe/*
