name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          echo 'wifi_ssid: "AutoDisplayLight"' > secrets.yaml
          echo 'wifi_password: "12345678ABCD"' >> secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        run: esphome compile esp32c3.yaml
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware*.bin

  build-exe:
    name: Build Exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyinstaller pystray pillow requests

      - name: Build exe
        run: pyinstaller autolight.spec

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/AutoDisplayLight.exe

  release:
    name: Release
    needs: [build-firmware, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts/ -type f

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          echo "Version: $VERSION"
          gh release create "v$VERSION" \
            --repo ${{ github.repository }} \
            --title "AutoDisplayLight v$VERSION" \
            --notes "AutoDisplayLight Release $VERSION" \
            artifacts/firmware/* artifacts/exe/*
