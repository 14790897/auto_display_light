name: Build and Release Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install esphome --index-url https://mirrors.aliyun.com/pypi/simple/
          esphome version

      - name: Create secrets.yaml
        run: |
          printf 'wifi_ssid: "AutoDisplayLight"\nwifi_password: "12345678"\n' > secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        run: |
          esphome compile esp32c3.yaml
          mkdir -p firmware_output
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.factory.bin firmware_output/
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.bin firmware_output/
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.ota.bin firmware_output/
          echo "=== Firmware files ==="
          ls -lh firmware_output/
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release and Upload firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Creating release v$VERSION"
          gh release create "v$VERSION" \
            --repo ${{ github.repository }} \
            --title "Firmware v$VERSION" \
            --notes "## ESP32-C3 TEMT6000 固件
          
          **编译时间:** $(date)
          
          ### 固件文件
          - \`firmware.factory.bin\` - 首次烧录（含 bootloader）
          - \`firmware.bin\` - 单独固件
          - \`firmware.ota.bin\` - OTA 升级" \
            firmware_output/firmware.factory.bin \
            firmware_output/firmware.bin \
            firmware_output/firmware.ota.bin
          echo "✅ Release created: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
