name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install esphome --index-url https://mirrors.aliyun.com/pypi/simple/
          esphome version

      - name: Create secrets.yaml
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "AutoDisplayLight"
          wifi_password: "12345678"
          EOF
          cat secrets.yaml

      - name: Compile firmware
        run: |
          mkdir -p firmware_output
          esphome compile esp32c3.yaml 2>&1 | tee compile.log
          echo "=== Compile log ==="
          cat compile.log
          echo "=== Firmware files ==="
          ls -lh .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/*.bin || echo "No firmware files found"
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Copy firmware
        run: |
          mkdir -p firmware_output
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.factory.bin firmware_output/ || echo "Warning: firmware.factory.bin not found"
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.bin firmware_output/ || echo "Warning: firmware.bin not found"
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.ota.bin firmware_output/ || echo "Warning: firmware.ota.bin not found"
          ls -lh firmware_output/ || echo "firmware_output is empty"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
