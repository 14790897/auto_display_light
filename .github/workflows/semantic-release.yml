name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install esphome --index-url https://mirrors.aliyun.com/pypi/simple/
          esphome version

      - name: Create secrets.yaml
        run: |
          printf 'wifi_ssid: "AutoDisplayLight"\nwifi_password: "12345678"\n' > secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        run: |
          esphome compile esp32c3.yaml
          mkdir -p firmware_output
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.factory.bin firmware_output/ || (echo "ERROR: firmware.factory.bin not found" && exit 1)
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.bin firmware_output/ || (echo "ERROR: firmware.bin not found" && exit 1)
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.ota.bin firmware_output/ || (echo "ERROR: firmware.ota.bin not found" && exit 1)
          echo "=== Firmware files ==="
          ls -lh firmware_output/
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          echo "=== Fetching tags ==="
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Created tag: $TAG"

      - name: Upload firmware to release
        if: steps.semantic.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semantic.outputs.TAG }}"
          if [ -z "$TAG" ]; then
            echo "No tag found, trying to get latest release"
            TAG=$(gh release list --repo ${{ github.repository }} --limit 1 | awk '{print $3}')
          fi
          echo "Uploading firmware to release $TAG"
          ls -lh firmware_output/
          gh release upload "$TAG" firmware_output/firmware.factory.bin --clobber
          gh release upload "$TAG" firmware_output/firmware.bin --clobber
          gh release upload "$TAG" firmware_output/firmware.ota.bin --clobber
          echo "✅ Firmware uploaded successfully"
