name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    outputs:
      firmware-built: ${{ steps.compile.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install esphome --index-url https://mirrors.aliyun.com/pypi/simple/
          esphome version

      - name: Create secrets.yaml
        run: |
          printf 'wifi_ssid: "AutoDisplayLight"\nwifi_password: "12345678"\n' > secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        id: compile
        run: |
          esphome compile esp32c3.yaml 2>&1
          echo "=== Checking firmware files ==="
          ls -lh .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/*.bin || (echo "ERROR: Firmware files not found!" && exit 1)
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.factory.bin
            .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.bin
            .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.ota.bin
          retention-days: 1

  release:
    name: Release
    needs: build-firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware_output/

      - name: Check firmware files
        run: |
          ls -lh firmware_output/
          test -f firmware_output/firmware.factory.bin || (echo "ERROR: firmware.factory.bin not found!" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
