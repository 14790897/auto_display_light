name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install esphome --index-url https://mirrors.aliyun.com/pypi/simple/
          esphome version

      - name: Create secrets.yaml
        run: |
          printf 'wifi_ssid: "AutoDisplayLight"\nwifi_password: "12345678"\n' > secrets.yaml
          cat secrets.yaml

      - name: Compile firmware
        run: |
          esphome compile esp32c3.yaml
          mkdir -p firmware_output
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.factory.bin firmware_output/ || (echo "ERROR: firmware.factory.bin not found" && exit 1)
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.bin firmware_output/ || (echo "ERROR: firmware.bin not found" && exit 1)
          cp .esphome/build/temt6000-sensor/.pioenvs/temt6000-sensor/firmware.ota.bin firmware_output/ || (echo "ERROR: firmware.ota.bin not found" && exit 1)
          echo "=== Firmware files ==="
          ls -lh firmware_output/
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release | tee release_output.txt
          cat release_output.txt

      - name: Upload firmware to release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新创建的 release tag
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found, skipping firmware upload"
            exit 0
          fi
          echo "Uploading firmware to release $TAG"
          gh release upload $TAG firmware_output/firmware.factory.bin --clobber || echo "Upload failed"
          gh release upload $TAG firmware_output/firmware.bin --clobber || echo "Upload failed"
          gh release upload $TAG firmware_output/firmware.ota.bin --clobber || echo "Upload failed"
          echo "Firmware uploaded successfully"
